# Common asset store for Layer 1 (Asset Placement).
#
# One catalog, organized by category. Each entry maps a friendly `name` to a
# resolvable USD reference plus placement hints. USD paths use Isaac Lab's
# Nucleus tokens ({ISAAC_NUCLEUS_DIR}, {ISAACLAB_NUCLEUS_DIR}) which resolve at
# runtime inside Isaac Sim / Isaac Lab, or a repo-relative path for local USDs.
#
# Placement hints (start_z, drive, default_scale, separation_m) come from the
# isaac-sim-orchestrator skill's multi-robot fleet reference so the placement
# agent positions things correctly without re-deriving them.

meta:
  nucleus_tokens:
    ISAAC_NUCLEUS_DIR: "{NUCLEUS_ASSET_ROOT_DIR}/Isaac"
    ISAACLAB_NUCLEUS_DIR: "{NUCLEUS_ASSET_ROOT_DIR}/Isaac/IsaacLab"
  notes: >
    NUCLEUS_ASSET_ROOT_DIR resolves from carb setting
    /persistent/isaac/asset_root/cloud at sim runtime. Robots are in meters;
    warehouse shells are often in cm (scale 0.01).
  local_store: >
    Locally-owned USD assets live under assets/store/<category>/ (a real,
    categorized on-disk store). Entries with relative_to: repo and a path under
    assets/store/ point there. Drop a USD into the matching category folder and
    add a catalog entry to register it.

categories:

  robots:
    nova_carter:
      usd: "{ISAAC_NUCLEUS_DIR}/Robots/NVIDIA/NovaCarter/nova_carter.usd"
      drive: differential
      start_z: 0.0
      separation_m: 2.0
      tags: [mobile, amr, warehouse, ros2]
      notes: "wheel radius 0.14 m, track 0.499 m; differential drive AMR"
    franka_panda:
      usd: "{ISAACLAB_NUCLEUS_DIR}/Robots/FrankaEmika/panda_instanceable.usd"
      drive: fixed-base
      start_z: 0.0
      separation_m: 1.5
      tags: [manipulator, arm, 7dof, ik, manipulation]
      notes: "end-effector only; not mobile. separation = 1.5x reach"
    franka_robotiq:
      usd: "{ISAAC_NUCLEUS_DIR}/Robots/FrankaRobotics/FrankaPanda/franka.usd"
